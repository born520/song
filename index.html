<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <meta property="og:title" content="친절한 은영씨">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #f0f2f5; display: flex; justify-content: center; overflow: hidden; font-family: -apple-system, sans-serif; }
    .swiper { width: 100%; max-width: 480px; height: 100vh; background: #000; position: relative; }
    .swiper-slide { width: 100%; height: 100%; overflow-y: auto; background: #000; display: flex; flex-direction: column; }
    
    .video-section { position: relative; width: 100%; background: #000; flex-shrink: 0; }
    .video-ratio { position: relative; width: 100%; padding-bottom: 177.77%; } 
    iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    
     
    .video-title-overlay {
      position: absolute; top: 40px; left: 0; width: 100%;
      text-align: center; z-index: 100; pointer-events: none;
      opacity: 0; transform: translateY(-10px);
      transition: all 0.8s ease;
    }
    .video-title-overlay.active { opacity: 1; transform: translateY(0); }
    .video-title-text {
      display: inline-block; background: rgba(0,0,0,0.5); color: #fff;
      padding: 8px 20px; border-radius: 20px; font-size: 18px; font-weight: bold;
      backdrop-filter: blur(5px);
    }

    .unmute-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 50; display: flex; justify-content: center; align-items: center;
      background: rgba(0,0,0,0.15); cursor: pointer;
    }
    .unmute-btn { background: rgba(255, 255, 255, 0.9); color: #000; padding: 18px 36px; border-radius: 50px; font-weight: bold; border: 2px solid #4285f4; }

    .swiper-button-next, .swiper-button-prev { color: #fff !important; background: rgba(0,0,0,0.2); width: 40px !important; height: 40px !important; border-radius: 50%; z-index: 60; }
    .swiper-button-next:after, .swiper-button-prev:after { font-size: 16px !important; }

    .info-panel { background: #fff; padding: 30px 20px; border-radius: 25px 25px 0 0; margin-top: -20px; z-index: 30; flex-grow: 1; position: relative; }
    .text-msg { font-size: 16px; color: #333; line-height: 1.7; margin-bottom: 20px; white-space: pre-wrap; }
    .action-btn { display: block; width: 100%; padding: 15px; background: #4285f4; color: #fff; text-align: center; text-decoration: none; border-radius: 12px; font-weight: bold; margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="swiper">
  <div class="swiper-wrapper">
          <div class="swiper-slide">
                  <div class="video-section">
            <div class="video-title-overlay" id="title-ov-0">
              <div class="video-title-text">유쾌한 은영씨</div>
            </div>
            <div class="video-ratio">

                src="https://www.youtube.com/embed/CynV7OsywG8?enablejsapi=1&amp;autoplay=1&amp;mute=1&amp;controls=0&amp;modestbranding=1&amp;rel=0&amp;loop=1&amp;playlist=CynV7OsywG8" 
                frameborder="0" allow="autoplay; encrypted-media"></iframe>
              <div class="unmute-overlay" id="overlay-0" onclick="handleStart('vid-0', this, '0')">
                <div class="unmute-btn">🔊 소리 켜기</div>

      </div>

              <iframe id="vid-1"

                frameborder="0" allow="autoplay; encrypted-media"></iframe>
              <div class="unmute-overlay" id="overlay-1" onclick="handleStart('vid-1', this, '1')">
                <div class="unmute-btn">🔊 소리 켜기</div>
              </div>
            </div>
          </div>
                <div class="info-panel">
                                        </div>
      </div>
          <div class="swiper-slide">
                  <div class="video-section">
            <div class="video-title-overlay" id="title-ov-2">
              <div class="video-title-text">관광기념품 홍보관 설치 및 유통 활성화 촉구</div>
            </div>
            <div class="video-ratio">
              <iframe id="vid-2" 
                src="https://www.youtube.com/embed/XmigrRnCtg0?enablejsapi=1&amp;autoplay=0&amp;mute=1&amp;controls=0&amp;modestbranding=1&amp;rel=0&amp;loop=1&amp;playlist=XmigrRnCtg0" 
                frameborder="0" allow="autoplay; encrypted-media"></iframe>
              <div class="unmute-overlay" id="overlay-2" onclick="handleStart('vid-2', this, '2')">
                <div class="unmute-btn">🔊 소리 켜기</div>
              </div>
            </div>
          </div>
                <div class="info-panel">
                                        </div>
      </div>
          <div class="swiper-slide">
                  <div class="video-section">
            <div class="video-title-overlay" id="title-ov-3">
              <div class="video-title-text">황산공원 일대의 열린관광지 조성 촉구</div>
            </div>
            <div class="video-ratio">
              <iframe id="vid-3"

      </div>

  <div class="swiper-button-next"></div>
  <div class="swiper-button-prev"></div>
  <div class="swiper-pagination"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
  let isGlobalMuted = true;
  const playedStates = { 0: true }; 

  const swiper = new Swiper('.swiper', {
    navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
    pagination: { el: '.swiper-pagination', clickable: true },
    watchOverflow: true,
    on: {
      init: function() { if(playedStates[0]) showTitleOverlay(0); },
      slideChange: function () {
        const activeIdx = this.activeIndex;
        document.querySelectorAll('iframe').forEach((f, idx) => {
          if (idx === activeIdx) {
            if (!playedStates[idx]) {
              f.contentWindow.postMessage('{"event":"command","func":"seekTo","args":[0, true]}', '*');
              playedStates[idx] = true; 
            }
            f.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
            showTitleOverlay(idx); 
            if(!isGlobalMuted) {
                f.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
                const ov = document.getElementById('overlay-' + idx);
                if(ov) ov.style.display = 'none';
            }
          } else {
            f.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
          }
        });
      }
    }
  });

  function showTitleOverlay(idx) {
    const el = document.getElementById('title-ov-' + idx);
    if(!el) return;
    el.classList.add('active');
    setTimeout(() => { el.classList.remove('active'); }, 3000); 
  }

  function handleStart(id, overlay, idx) {
    const f = document.getElementById(id);
    if (f && f.contentWindow) {
      f.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
      f.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
      isGlobalMuted = false;
      showTitleOverlay(idx);
    }
    overlay.style.display = 'none';
  }
</script>
</body>
</html>
